name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skill format
        run: python3 scripts/check_skills.py
      - name: Generic leak scan
        run: python3 scripts/leak_scan.py
